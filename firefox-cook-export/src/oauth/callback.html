<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pantry Butler — Connect</title>
  <style>
    body {
      font: 14px/1.5 system-ui, sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f5f5f5;
      color: #111;
    }
    .card {
      max-width: 420px;
      padding: 24px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .ok { color: #1a7f37; }
    .err { color: #c0392b; }
    .spinner {
      width: 22px; height: 22px;
      border: 3px solid #ddd; border-top-color: #2f6f4f;
      border-radius: 50%; margin: 12px auto;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #2f6f4f; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Pantry Butler</h1>
    <div id="status">Connecting…</div>
  </div>
  <script src="callback.js"></script>
</body>
</html>
